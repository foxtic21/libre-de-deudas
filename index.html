<head>

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Libre">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Libre: matá tus deudas como en un juego, construí tu negocio y desbloqueá tus viajes.">
<title>Libre · Matá la deuda</title>
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="assets/styles.css?v=2.0.1">
<script>try{var t=localStorage.getItem('libre-theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t}catch(e){}</script>
<script src="config.js?v=2.0.1"></script>
</head>
<body>
<div class="topbar" id="topbar" aria-hidden="true"></div>
<main id="app"><div class="splash"><div class="spin"></div></div></main>

<div class="dock hide" id="dock">
  <nav class="tabbar" id="tabbar" aria-label="Secciones">
    <button data-tab="hoy" class="on"><svg class="i" viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5"/><path d="M5.5 9v11h13V9"/><path d="M10 20v-5.5h4V20"/></svg>Hoy</button>
    <button data-tab="movs"><svg class="i" viewBox="0 0 24 24"><path d="M8.5 6H21M8.5 12H21M8.5 18H21M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></svg>Movimientos</button>
    <button data-tab="batalla"><svg class="i" viewBox="0 0 24 24"><path d="M14.5 17.5 3 6V3h3l11.5 11.5"/><path d="m13 19 6-6M16 16l4 4M19 21l2-2"/></svg>Batalla</button>
    <button data-tab="negocio"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="13" rx="2.5"/><path d="M8.5 7V5.5A2 2 0 0 1 10.5 3.5h3a2 2 0 0 1 2 2V7M3 13h18"/></svg>Negocio</button>
    <button data-tab="plan"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.2"/></svg>Plan</button>
  </nav>
  <button class="fab" id="fab" aria-label="Registrar movimiento"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
</div>

<div class="sheet-bg" id="sheetBg"><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>

<script type="module" src="assets/app.js?v=2.0.1"></script>

</html>
